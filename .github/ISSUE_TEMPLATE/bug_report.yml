name: Bug report / Bug 报告
description: Report a reproducible, non-security defect / 报告可复现的非安全问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include recordings, transcripts, API keys, credentials, or private screenshots. Security and privacy vulnerabilities must follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary / 摘要
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices and OS versions / 设备与系统版本
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Soundloom version or commit / Soundloom 版本或 commit
    validations:
      required: true
